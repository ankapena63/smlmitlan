name: My Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: "3.x"

    - run: pip install platformio

    - run: pio run -e tasmota32

    - uses: actions/upload-artifact@v4
      with:
        name: firmware
        path: .pio/build/tasmota32/firmware.bin
